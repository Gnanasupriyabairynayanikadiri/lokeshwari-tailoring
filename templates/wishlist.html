<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist | Lokeshwari Tailoring & Embroidery</title>

    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='images/logo.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold mb-0">❤️ My Wishlist</h2>

        <a href="/gallery" class="btn btn-outline-dark rounded-pill">
            ← Continue Browsing
        </a>

    </div>

    <div id="wishlistContainer" class="row g-4"></div>

    <div id="emptyState" class="text-center py-5 d-none">

        <div class="display-5 mb-3">🧵</div>

        <h4 class="fw-bold">Your wishlist is empty</h4>

        <p class="text-muted">
            Browse the gallery and save your favorite blouse, lehenga, or dress designs.
        </p>

    </div>

</div>

<script>

const container = document.getElementById('wishlistContainer');
const emptyState = document.getElementById('emptyState');

let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');

function renderWishlist() {

    container.innerHTML = '';

    if (wishlist.length === 0) {
        emptyState.classList.remove('d-none');
        return;
    }

    emptyState.classList.add('d-none');

    wishlist.forEach(item => {

        container.innerHTML += `
            <div class="col-sm-6 col-lg-4">

                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">

                    <img src="${item.image}"
                         class="card-img-top"
                         style="height:250px;object-fit:cover;"
                         alt="${item.title}">

                    <div class="card-body d-flex flex-column">

                        <h5 class="fw-bold">${item.title}</h5>

                        <p class="text-muted small">${item.category}</p>

                        <div class="d-grid gap-2 mt-auto">

                            <a href="/design/${item.code}"
                               class="btn btn-outline-dark rounded-pill">

                                View Details

                            </a>

                            <button class="btn btn-outline-danger rounded-pill"
                                    onclick="removeItem('${item.code}')">

                                Remove

                            </button>

                        </div>

                    </div>

                </div>

            </div>
        `;
    });

}

function removeItem(code) {

    wishlist = wishlist.filter(item => item.code !== code);

    localStorage.setItem('wishlist', JSON.stringify(wishlist));

    renderWishlist();

}

renderWishlist();

</script>

</body>
</html>
