<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Design | Lokeshwari Embroidery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #8b1e3f;
            font-weight: 700;
        }

        .preview-image {
            max-width: 220px;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid #dee2e6;
            padding: 4px;
            background: white;
            object-fit: cover;
        }

        .readonly-input {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card form-card">

                <div class="card-body p-4">

                    <h2 class="page-title mb-4">
                        Edit Design
                    </h2>

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="alert"
                                            aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" enctype="multipart/form-data">

                        <!-- Design Code (Read Only) -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Design Code
                            </label>

                            <input type="text"
                                   class="form-control readonly-input"
                                   value="{{ design.code }}"
                                   disabled>

                            <div class="form-text">
                                Design code cannot be changed.
                            </div>

                        </div>

                        <!-- Title -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Design Title
                            </label>

                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   value="{{ design.title }}"
                                   required>

                        </div>

                        <!-- Category -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <select name="category"
                                    class="form-select"
                                    required>

                                <option value="Bridal"
                                    {% if design.category == 'Bridal' %}selected{% endif %}>
                                    Bridal
                                </option>

                                <option value="Neck Design"
                                    {% if design.category == 'Neck Design' %}selected{% endif %}>
                                    Neck Design
                                </option>

                                <option value="Sleeve Design"
                                    {% if design.category == 'Sleeve Design' %}selected{% endif %}>
                                    Sleeve Design
                                </option>

                                <option value="Border Design"
                                    {% if design.category == 'Border Design' %}selected{% endif %}>
                                    Border Design
                                </option>

                            </select>

                        </div>

                        <!-- Description -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="4"
                                      required>{{ design.description }}</textarea>

                        </div>

                        <!-- Current Image Preview -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Current Image
                            </label>

                            <div class="text-center">

                                <img id="previewImage"
                                     src="{{ url_for('static', filename=design.image) }}"
                                     alt="Current Design Image"
                                     class="preview-image">

                            </div>

                        </div>

                        <!-- Replace Image -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Replace Image (Optional)
                            </label>

                            <input type="file"
                                   name="image"
                                   id="editImageInput"
                                   class="form-control"
                                   accept=".jpg,.jpeg,.png">

                            <div class="form-text">
                                Leave empty to keep the current image.
                            </div>

                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2 flex-wrap">

                            <button type="submit"
                                    class="btn btn-primary">
                                Update Design
                            </button>

                            <a href="/admin/dashboard"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Live Image Preview Script -->
<script>

document.getElementById('editImageInput').addEventListener('change', function(event) {

    const file = event.target.files[0];

    const previewImage = document.getElementById('previewImage');

    if (file) {

        const reader = new FileReader();

        reader.onload = function(e) {

            previewImage.src = e.target.result;
        };

        reader.readAsDataURL(file);
    }
});

</script>

</body>
</html>
