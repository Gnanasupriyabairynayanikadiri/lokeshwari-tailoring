<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order | Lokeshwari Embroidery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card-custom {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #8b1e3f;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">
            Edit Order #{{ order.id }}
        </h2>

        <a href="/admin/orders" class="btn btn-secondary">
            Back to Orders
        </a>
    </div>

    <div class="card card-custom">

        <div class="card-body p-4">

            <form method="POST">

                <!-- Customer Name -->
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text"
                           class="form-control"
                           value="{{ order.name }}"
                           readonly>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text"
                           class="form-control"
                           value="{{ order.phone }}"
                           readonly>
                </div>

                <!-- Design -->
                <div class="mb-3">
                    <label class="form-label">Design</label>
                    <input type="text"
                           class="form-control"
                           value="{{ order.design_code }} - {{ order.design_title }}"
                           readonly>
                </div>

                <!-- Blouse Size -->
                <div class="mb-3">
                    <label class="form-label">Blouse Size</label>
                    <input type="text"
                           name="blouse_size"
                           class="form-control"
                           value="{{ order.blouse_size }}"
                           placeholder="Example: 34, 36, 38">
                </div>

                <!-- Delivery Date -->
                <div class="mb-3">
                    <label class="form-label">Delivery Date</label>
                    <input type="date"
                           name="delivery_date"
                           class="form-control"
                           value="{{ order.delivery_date }}">
                </div>

                <!-- Advance Amount -->
                <div class="mb-3">
                    <label class="form-label">Advance Amount (₹)</label>
                    <input type="number"
                           name="advance_amount"
                           class="form-control"
                           value="{{ order.advance_amount }}"
                           placeholder="Enter advance amount">
                </div>

                <!-- Balance Amount -->
                <div class="mb-4">
                    <label class="form-label">Balance Amount (₹)</label>
                    <input type="number"
                           name="balance_amount"
                           class="form-control"
                           value="{{ order.balance_amount }}"
                           placeholder="Enter balance amount">
                </div>

                <!-- Save Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Save Order Details
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
